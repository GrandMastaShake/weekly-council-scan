name: CI

# The panel is committed data, so CI checks the data as well as the code:
# a bad commit to data/weekly fails here rather than downstream in the
# heatmap, or silently.
#
# What this cannot see: a commit a workflow pushes. A push made with the
# workflow token starts no workflow, so the backfill's and the daily job's
# commits are never the head of a run here. Each runs scripts/panel_guard.py
# itself, before it commits.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # HEAD^ must exist for the panel check below: it is what a pull
          # request is compared with, and the fallback for a push. The
          # default shallow clone has no parent, and the check fails rather
          # than pass without one.
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      - name: Feed and config gates on the committed panel
        run: python scripts/truth_check.py --repo . --feed --config

      # Runs whatever the two steps above did. A push is compared once, by
      # its own run, with the tip it replaced; the next push starts from the
      # new tip. So a run that stopped at a red test never compared its
      # push, and nothing came back for it: on 2026-09-25 the push of that
      # week's file failed at Tests, and this step and the feed gate were
      # skipped. It needs git and the standard library, nothing a failed
      # test could have broken.
      - name: Panel is intact against what it held before
        if: ${{ !cancelled() }}
        env:
          # The tip of the branch before this push. Empty on a pull request.
          PUSH_BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          # What "before" is. A pull request is checked out as its merge
          # into the base branch, so HEAD^ is that branch. A push is not:
          # HEAD^ is the parent of its LAST commit only. On 2026-10-03 the
          # runner pushed the weekly file, market_state.json and
          # universe.json as three commits; this step ran on the third, and
          # the commit that wrote the weekly file was never compared with
          # anything. So a push is compared with the tip it replaced.
          base="HEAD^"
          if [ -n "$PUSH_BEFORE" ] && ! printf '%s' "$PUSH_BEFORE" | grep -Eq '^0+$'; then
            if git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null \
                || git fetch --quiet --no-tags --depth=1 origin "$PUSH_BEFORE"; then
              base="$PUSH_BEFORE"
            else
              echo "::warning title=Panel check::Could not fetch $PUSH_BEFORE, the tip of the branch before this push. Comparing the last commit with its parent only; the push's earlier commits were not looked at."
            fi
          fi
          if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            # Only a first commit has nothing before it. A parent that is
            # named in the commit and absent from the checkout is a clone
            # too shallow to compare, and that must not read as a pass. The
            # commit's header is asked, up to its first blank line: a
            # message can have a line that begins "parent " too.
            commit="$(git cat-file -p HEAD)"
            case "${commit%%$'\n\n'*}" in
              *$'\n'"parent "*)
                echo "::error title=Panel check::HEAD has a parent this checkout did not fetch, so there is nothing to compare the panel with. The checkout step needs fetch-depth 2 or more."
                exit 1 ;;
            esac
            echo "No parent commit; nothing to compare with."
            exit 0
          fi
          echo "Comparing with $(git rev-parse --short "${base}^{commit}")"

          # Both checks below run, so one failing does not hide the other.
          set +e

          # What a panel file held, it still holds: every file of data/weekly
          # and data/daily that was there is still there, with every bar and
          # every label it had (scripts/panel_guard.py has the rule). This
          # step used to carry its own copy of the first version of that
          # guard, a count of series per file. It passed a commit that
          # changed a close, and one that deleted a file.
          python scripts/panel_guard.py --against "$base"
          panel=$?

          PANEL_BASE="$base" python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path

          # The commit the step above settled on. HEAD^ when run by hand.
          BASE = os.environ.get("PANEL_BASE") or "HEAD^"

          def previous(path):
              r = subprocess.run(["git", "show", BASE + ":" + path],
                                 capture_output=True, text=True)
              return json.loads(r.stdout) if r.returncode == 0 else None

          def current(path):
              if not Path(path).is_file():
                  return {}
              return json.loads(Path(path).read_text(encoding="utf-8"))

          failed = False

          # data/us2y_treasury.json is append-only by week for the same
          # reason. It holds the Treasury 2-year for the weeks whose weekly
          # file cannot (DATA_FEED.md sec.1a); an entry that changes or
          # disappears rewrites what market_state derives for a week nobody
          # can observe again. New weeks pass; a changed or lost one fails.
          hist = "data/us2y_treasury.json"
          was = previous(hist)
          if was is None:
              print("us2y history: not in the previous commit; nothing to compare")
          else:
              before = was.get("series", {})
              now = current(hist).get("series", {})
              keep = ("close", "observed")
              bad = [(w, rec, now.get(w)) for w, rec in sorted(before.items())
                     if w not in now
                     or any(now[w].get(k) != rec.get(k) for k in keep)]
              if bad:
                  print("US2Y HISTORY REGRESSION -- committed weeks were changed or removed:")
                  for week, old, got in bad:
                      print("  %s  %s -> %s" % (week, old, got))
                  failed = True
              else:
                  print("us2y history intact: %d week(s) unchanged, %d added"
                        % (len(before), len(now) - len(before)))

          # data/commodity_settlements.json, the same contract for WTI, GOLD
          # and SILVER (DATA_FEED.md sec.1d). A settlement that is on file
          # stays as it is. So does "audited_through": moving it re-admits
          # or drops committed closes for every reader at once. A week
          # recorded as unavailable may leave that list only by gaining a
          # settlement.
          hist = "data/commodity_settlements.json"
          was = previous(hist)
          if was is None:
              print("commodity settlements: not in the previous commit; nothing to compare")
          else:
              now = current(hist).get("instruments", {})
              keep = ("close", "contract", "symbol", "observed")
              bad, kept, added = [], 0, 0
              for name, rec in sorted(was.get("instruments", {}).items()):
                  got = now.get(name) or {}
                  if rec.get("audited_through") != got.get("audited_through"):
                      bad.append("%s audited_through  %s -> %s" % (
                          name, rec.get("audited_through"),
                          got.get("audited_through")))
                  series = got.get("series") or {}
                  for week, entry in sorted((rec.get("series") or {}).items()):
                      if week not in series or any(
                              series[week].get(k) != entry.get(k) for k in keep):
                          bad.append("%s %s  %s -> %s" % (
                              name, week, entry, series.get(week)))
                      else:
                          kept += 1
                  added += len(series) - len(rec.get("series") or {})
                  for week in sorted(rec.get("unavailable") or {}):
                      if week not in (got.get("unavailable") or {}) \
                              and week not in series:
                          bad.append("%s %s  was recorded as unavailable and "
                                     "is now neither that nor a settlement"
                                     % (name, week))
              if bad:
                  print("COMMODITY SETTLEMENT REGRESSION -- committed entries were changed or removed:")
                  for line in bad:
                      print("  " + line)
                  failed = True
              else:
                  print("commodity settlements intact: %d unchanged, %d added"
                        % (kept, max(added, 0)))

          sys.exit(1 if failed else 0)
          PY
          history=$?
          set -e
          if [ "$panel" -ne 0 ] || [ "$history" -ne 0 ]; then exit 1; fi
