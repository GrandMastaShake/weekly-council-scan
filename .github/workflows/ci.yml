name: CI

# The panel is committed data, so CI checks the data as well as the code:
# a bad commit to data/weekly fails here rather than downstream in the
# heatmap, or silently.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # HEAD^ must exist for the panel-regression check below; the default
          # shallow clone has no parent, which would skip the check silently.
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      - name: Feed and config gates on the committed panel
        run: python scripts/truth_check.py --repo . --feed --config

      - name: Panel is intact against the previous commit
        run: |
          # A panel file that LOST series is the 2026-08-26 failure returning.
          # Covers data/daily as well: same append-only contract, same hazard.
          # Compare HEAD against its parent rather than trusting the diff to
          # look obviously wrong.
          git rev-parse HEAD^ >/dev/null 2>&1 || { echo "No parent commit; skipping."; exit 0; }
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path

          def at(commit, path):
              r = subprocess.run(["git", "show", commit + ":" + path],
                                 capture_output=True, text=True)
              if r.returncode != 0:
                  return None
              return len(json.loads(r.stdout).get("series", {}))

          lost = []
          panel = (sorted(Path("data/weekly").glob("*.json"))
                   + sorted(Path("data/daily").glob("*.json")))
          for p in panel:
              path = p.as_posix()
              before = at("HEAD^", path)
              if before is None:
                  continue          # new file, nothing to lose
              after = len(json.loads(p.read_text(encoding="utf-8")).get("series", {}))
              if after < before:
                  lost.append((path, before, after))

          if lost:
              print("PANEL REGRESSION -- series were removed:")
              for path, before, after in lost:
                  print("  %-38s %4d -> %4d" % (path, before, after))
              sys.exit(1)
          print("panel intact: no weekly or daily file lost series")

          # data/us2y_treasury.json is append-only by week for the same
          # reason. It holds the Treasury 2-year for the weeks whose weekly
          # file cannot (DATA_FEED.md sec.1a); an entry that changes or
          # disappears rewrites what market_state derives for a week nobody
          # can observe again. New weeks pass; a changed or lost one fails.
          hist = "data/us2y_treasury.json"
          r = subprocess.run(["git", "show", "HEAD^:" + hist],
                             capture_output=True, text=True)
          if r.returncode != 0:
              print("us2y history: not in the previous commit; nothing to compare")
              sys.exit(0)
          before = json.loads(r.stdout).get("series", {})
          now = {}
          if Path(hist).is_file():
              now = json.loads(Path(hist).read_text(encoding="utf-8")).get("series", {})
          keep = ("close", "observed")
          bad = [(w, rec, now.get(w)) for w, rec in sorted(before.items())
                 if w not in now
                 or any(now[w].get(k) != rec.get(k) for k in keep)]
          if bad:
              print("US2Y HISTORY REGRESSION -- committed weeks were changed or removed:")
              for week, was, got in bad:
                  print("  %s  %s -> %s" % (week, was, got))
              sys.exit(1)
          print("us2y history intact: %d week(s) unchanged, %d added"
                % (len(before), len(now) - len(before)))
          PY
